spring:
  application:
    name: ecommerce-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:xxxx}
    password: ${MYSQL_PASSWORD:xxxx}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${MAIL_USERNAME:xxxx@gmail.com}
    password: ${MAIL_PASSWORD:xxxx}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.gmail.com
      mail.smtp.ssl.protocols: TLSv1.2

server:
  port: ${PORT:9090}

jwt:
  secret: ${JWT_SECRET:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
  expiration: 86400000 # 24 hours in milliseconds

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.security: DEBUG

# Razorpay Configuration
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:xxxx}
    secret: ${RAZORPAY_KEY_SECRET:xxxx}

app:
  store:
    name: "Sales Savvy"
